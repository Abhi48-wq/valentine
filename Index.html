<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #ffecd2);
            color: #d63384;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: all 1s ease;
        }
        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .buttons {
            margin-top: 30px;
        }
        button {
            font-size: 1.5em;
            padding: 15px 30px;
            margin: 0 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #yes {
            background: #ff6b9d;
            color: white;
        }
        #yes:hover {
            background: #e63946;
            transform: scale(1.1);
        }
        #no {
            background: #f8f9fa;
            color: #d63384;
            position: absolute;
        }
        #no:hover {
            /* This will be overridden by JS for movement */
        }
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .heart {
            position: absolute;
            font-size: 2em;
            animation: float 6s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }
        .love-message {
            font-size: 2.5em;
            font-weight: bold;
            text-align: center;
            margin-top: 50px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: fadeIn 2s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .emojis {
            font-size: 2em;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <div class="container" id="question">
        <div class="emojis">❤️ 💖 💕 💞 💓</div>
        <h1>Will you be my Valentine? 💌</h1>
        <div class="buttons">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>
        <div class="emojis">🌹 💑 😘</div>
    </div>
    <div class="container" id="love-screen" style="display: none;">
        <div class="emojis">❤️ 💖 💕 💞 💓 🌹 💑 😘</div>
        <div class="love-message">
            I Love You<br>and Always Will 💕
        </div>
        <div class="emojis">🌟 ✨ 💫</div>
    </div>

    <script>
        // Generate floating hearts
        const heartsContainer = document.getElementById('hearts');
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 6 + 's';
            heartsContainer.appendChild(heart);
        }

        // Handle No button movement
        const noButton = document.getElementById('no');
        noButton.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);
            noButton.style.left = x + 'px';
            noButton.style.top = y + 'px';
        });

        // Handle Yes button click
        document.getElementById('yes').addEventListener('click', () => {
            document.getElementById('question').style.display = 'none';
            document.getElementById('love-screen').style.display = 'block';
        });
    </script>
</body>
</html>
